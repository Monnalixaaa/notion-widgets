*{box-sizing:border-box;margin:0;padding:0}
:root{--f:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI',sans-serif;--fd:'Oswald','Zen Kaku Gothic New','Arial Narrow',sans-serif;
--bg:#FFFFFF;--paper:#F5EEDF;--navy:#1F4A5C;--navy2:#2B6075;--ink:#1C2A31;--red:#C8402F;--red2:#DB5A43;--soft:#E9DFCB;--soft2:#D9CBB0;--mute:#7A7163;--line:#DED3BD;--on:#FFF8EC;--cream:#F5EEDF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--paper:#22282B;--navy:#2A5F73;--navy2:#36748A;--ink:#EDE6D8;--red:#E0664E;--red2:#EB7E68;--soft:#2E363A;--soft2:#3B4549;--mute:#9DA5A6;--line:#353E42;--on:#FFF8EC;--cream:#F5EEDF;color-scheme:dark}}
html,body{font-variant-numeric:lining-nums tabular-nums;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--f)}
button,input{font-variant-numeric:lining-nums tabular-nums;font-family:var(--f);cursor:pointer;border:0}

/* station-sign plate: navy name band on top, cream plate, red rule at the bottom */
body:before{content:attr(data-jp);position:fixed;z-index:3;left:8px;right:8px;top:8px;height:32px;padding-left:14px;
 background:var(--navy);border-radius:9px 9px 0 0;color:var(--cream);font:900 15px/32px var(--f);letter-spacing:5px;white-space:nowrap}
body:after{content:attr(data-en);position:fixed;z-index:4;top:8px;right:8px;height:32px;padding-right:36px;
 font:500 11px/32px var(--fd);letter-spacing:3px;color:rgba(245,238,223,.72);
 background:radial-gradient(circle at calc(100% - 19px) 50%,var(--red) 0 7px,transparent 7.5px)}
.w{inset:40px 8px 8px !important;background:var(--paper);border-radius:0 0 9px 9px;border-bottom:4px solid var(--red);
 box-shadow:inset 0 0 0 1px var(--line);padding:12px 16px !important}
.stk{display:none}

.w{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px}
.calc{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
.scr{background:var(--soft);border-radius:12px;padding:10px 14px;text-align:right;min-height:66px;display:flex;flex-direction:column;justify-content:flex-end}
.scr i{font:12px/1.2 var(--f);color:var(--mute);min-height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scr b{font:400 30px/1.1 var(--f);color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keys button{font:600 16px/1 var(--f);border-radius:10px;padding:11px 0;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.keys button:active{transform:translateY(1px)}
.keys .op{background:var(--soft);color:var(--red);box-shadow:none}
.keys .fn{color:var(--mute);font-style:normal;font-size:13px}
.keys .eq{background:var(--red);color:var(--on);box-shadow:none}
.keys .z{grid-column:span 2}
.s1{right:2px;top:2px;width:15%;max-width:52px;transform:rotate(12deg)}
.scr b{font-family:var(--fd);font-weight:500}
.scr{background:var(--navy);border-radius:8px}.scr b{color:var(--cream);font-weight:700}.scr i{color:rgba(245,238,223,.6)}
.keys button{border-radius:8px;background:var(--bg);font-weight:700}
.keys .op{background:var(--soft);color:var(--navy)}.keys .eq{background:var(--red);color:var(--on)}
@media (prefers-color-scheme:dark){.keys .op{color:var(--ink)}}

<div class="w"><div class="calc"><div class="scr"><i id="h"></i><b id="v">0</b></div>
<div class="keys">
<button class="fn" data-k="C">AC</button><button class="fn" data-k="B">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
<button class="z" data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
</div></div></div>
<script>
let cur='0',acc=null,op=null,fresh=false;const v=document.getElementById('v'),h=document.getElementById('h');
const sym={'/':'÷','*':'×','-':'−','+':'+'};
const fmt=x=>{if(!isFinite(x))return 'oops';const r=Math.round(x*1e10)/1e10;return Math.abs(r)>=1e12?r.toExponential(4):r.toLocaleString('en-US',{maximumFractionDigits:8})};
const calc=(a,b,o)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:b===0?NaN:a/b;
function show(){v.textContent=cur.includes('.')&&!fresh?cur.replace(/^(-?\d+)/,m=>(+m).toLocaleString('en-US')):fmt(+cur);h.textContent=acc!==null&&op?fmt(acc)+' '+sym[op]:''}
function press(k){
 if(/\d/.test(k)){cur=(fresh||cur==='0')?k:cur+k;fresh=false}
 else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
 else if(k==='C'){cur='0';acc=null;op=null}
 else if(k==='B'){cur=cur.length>1?cur.slice(0,-1):'0'}
 else if(k==='%'){cur=String(+cur/100)}
 else if(k==='='){if(op!==null){cur=String(calc(acc,+cur,op));acc=null;op=null;fresh=true}}
 else{if(op!==null&&!fresh)acc=calc(acc,+cur,op);else if(acc===null||!fresh)acc=+cur;op=k;fresh=true}
 show()}
document.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>press(b.dataset.k));
addEventListener('keydown',e=>{const m={Enter:'=',Backspace:'B',Escape:'C'};const k=m[e.key]||e.key;if(/^[\d.+\-*\/%=]$/.test(k)||['B','C'].includes(k)){e.preventDefault();press(k)}});
show();
</script></body></html>
