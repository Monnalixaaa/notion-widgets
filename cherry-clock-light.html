<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cherry clock</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFFFFF;--ink:#2A1A17;--red:#9A0002;--red2:#C0121A;--soft:#F7ECE9;--soft2:#EFD9D3;--mute:#9C7F78;--line:#EEDFDA;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--ink:#F1E6E1;--red:#E35D66;--red2:#F07C84;--soft:#262020;--soft2:#3A2B2B;--mute:#A8938E;--line:#332828;--on:#191919;color-scheme:dark}}
html,body{font-variant-numeric:lining-nums tabular-nums;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Fraunces',Georgia,serif}
button{font-variant-numeric:lining-nums tabular-nums;font-family:'Fraunces',Georgia,serif;cursor:pointer;border:0}
.stk{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(42,26,23,.18))}

.w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px}
.hi{font:13px/1.2 'Fraunces',Georgia,serif;color:var(--mute);letter-spacing:.3px}
.fl{display:flex;gap:8px}
.tile{position:relative;width:clamp(64px,30vw,104px);aspect-ratio:1/1.05;border-radius:12px;background:linear-gradient(var(--red2) 0 50%,var(--red) 50% 100%);
 color:#FFF7F5;display:flex;align-items:center;justify-content:center;font:400 clamp(38px,19vw,68px)/1 'Fraunces',Georgia,serif;box-shadow:0 4px 10px rgba(120,0,6,.22)}
.tile:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--bg);opacity:.85}
.tile:before{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:6px;margin-top:-3px;background:radial-gradient(circle at 3px 3px,var(--bg) 2.5px,transparent 3px) left/6px 6px no-repeat,radial-gradient(circle at 3px 3px,var(--bg) 2.5px,transparent 3px) right/6px 6px no-repeat}
.ap{font:12px/1 'Fraunces',Georgia,serif;color:var(--mute);margin-top:-4px}
.date{font:15px/1.2 'Fraunces',Georgia,serif;color:var(--ink)}
.s1{width:22%;max-width:80px;right:4px;bottom:4px;transform:rotate(-8deg)}
.s2{width:15%;max-width:54px;left:4px;top:4px;transform:rotate(-12deg)}

/* pattern frame (Commission Studio look): pattern fills edge-to-edge, solid card on top */
body{background:var(--bg) none center/cover no-repeat}
body:before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.08;pointer-events:none}
@media (prefers-color-scheme:dark){body:before{background:#000;opacity:.38}}
.w{inset:14px !important;background:var(--bg);border-radius:14px;box-shadow:0 3px 12px rgba(60,0,4,.18)}
.stk{z-index:2}

/* ---- v2 light: soft editorial ---- */
:root{--bg:#FBF6F2;--ink:#3B2723;--red:#8E1B22;--red2:#B0353C;--soft:#F4E6E1;--soft2:#EAD3CC;--mute:#A68A83;--line:#EBDCD6;--on:#FFF9F6}
@media (prefers-color-scheme:dark){:root{--bg:#1C1918;--ink:#EFE4DF;--red:#E07A80;--red2:#EB9A9F;--soft:#2A2321;--soft2:#3A2E2B;--mute:#9E8B86;--line:#332B29;--on:#1C1918}}
html,body{background:var(--bg) !important}
body:before{display:none !important}
.w{inset:var(--cvh) 0 0 0 !important;background:transparent !important;border:0 !important;border-radius:0 !important;box-shadow:none !important}
.stk{display:none !important}
button{transition:background .2s,color .2s}
/* small labels: quiet italic */
.hi,.ap,.sub,.tm i,.m span,.scr i{font-style:italic !important;color:var(--mute) !important;letter-spacing:.2px}
/* pills: soft blush, active = wine outline fill */
.modes button,.nav button,.ctl button,#go,#rs{background:var(--soft) !important;color:var(--red) !important;box-shadow:none !important;font-weight:400 !important}
.modes button.on,#go{background:var(--red) !important;color:var(--on) !important}
/* photo cover band on top, like a Notion page cover */
:root{--cvh:clamp(48px,26vh,100px)}
.cv{position:fixed;left:0;right:0;top:0;height:var(--cvh);background-size:cover;background-position:center;z-index:0}
.w{z-index:1}
/* clock: big serif numerals, no tiles */
.tile{background:none !important;box-shadow:none !important;color:var(--red) !important;width:auto !important;aspect-ratio:auto !important;font-size:clamp(46px,22vw,78px) !important;letter-spacing:-1px}
.tile:before,.tile:after{display:none !important}
.fl{gap:2px !important;align-items:center}
.fl .tile:first-child{position:relative}
.fl:has(.tile)>.tile:first-child::after{content:":" !important;display:inline !important;position:static !important;background:none !important;height:auto !important;margin:0 4px !important;opacity:.45 !important;font-size:.8em}
.date{color:var(--ink) !important;border-top:1px solid var(--line);padding-top:8px;min-width:60%}
/* rings and bars: hairline */
.ring circle{stroke-width:3 !important}
.trk{stroke:var(--soft2) !important}
.ring{border-color:var(--soft2) !important}
/* breathe: blush orb with wine word */
.orb{background:var(--soft2) !important;box-shadow:none !important;border:1px solid var(--red)}
.lbl{color:var(--red) !important;text-shadow:none !important;font-weight:400 !important;font-style:italic}
/* calendar */
.m{font-weight:400 !important;font-style:italic}
.d.t{background:none !important;color:var(--red) !important;box-shadow:inset 0 0 0 1px var(--red);font-weight:600}
.d.we{color:var(--red2) !important}
/* calculator */
.scr{background:transparent !important;border-bottom:1px solid var(--line);border-radius:0 !important}
.keys button{background:var(--bg) !important;box-shadow:inset 0 0 0 1px var(--line) !important;font-weight:400 !important}
.keys .op{background:var(--soft) !important;color:var(--red) !important;box-shadow:none !important}
.keys .eq{background:var(--red) !important;color:var(--on) !important;box-shadow:none !important}
/* progress + payday headings */
.h{font-weight:400 !important;font-style:italic;padding-right:0 !important}
.h span{font-style:italic;color:var(--mute) !important}
.bar{height:3px !important;background:var(--soft2) !important}
.r b{font-weight:400 !important}
.u{background:transparent !important;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px !important}
