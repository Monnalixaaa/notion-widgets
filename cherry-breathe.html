<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cherry breathing</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFFFFF;--ink:#2A1A17;--red:#9A0002;--red2:#C0121A;--soft:#F7ECE9;--soft2:#EFD9D3;--mute:#9C7F78;--line:#EEDFDA;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--ink:#F1E6E1;--red:#E35D66;--red2:#F07C84;--soft:#262020;--soft2:#3A2B2B;--mute:#A8938E;--line:#332828;--on:#191919;color-scheme:dark}}
html,body{font-variant-numeric:lining-nums tabular-nums;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Fraunces',Georgia,serif}
button{font-variant-numeric:lining-nums tabular-nums;font-family:'Fraunces',Georgia,serif;cursor:pointer;border:0}
.stk{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(42,26,23,.18))}

.w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px}
.orbw{position:relative;width:min(60vw,50vh,180px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#D2202A,#9A0002 50%,#5E0003 100%);box-shadow:0 6px 18px rgba(94,0,3,.35),inset 0 2px 6px rgba(255,255,255,.18);transform:scale(.55);transition:transform 4s ease-in-out}
.ring{position:absolute;inset:-4px;border-radius:50%;border:1px dashed var(--soft2)}
.lbl{position:relative;font:600 15px/1.2 'Fraunces',Georgia,serif;color:#FFF3F0;text-align:center;text-shadow:0 1px 2px rgba(60,0,4,.4)}
.lbl small{display:block;font:400 22px/1 'Fraunces',Georgia,serif;margin-top:4px}
.sub{font:12px/1.4 'Fraunces',Georgia,serif;color:var(--mute);text-align:center}
#go{font:600 13px/1 'Fraunces',Georgia,serif;border-radius:99px;padding:9px 22px;background:var(--red);color:var(--on)}
.s1{right:2px;top:2px;width:16%;max-width:56px;transform:rotate(14deg)}

<script>
const steps=[['breathe in',4,1],['hold',4,1],['breathe out',6,.55]];
const orb=document.getElementById('orb'),lbl=document.getElementById('lbl'),go=document.getElementById('go'),sub=document.getElementById('sub');
let run=null,i=0,left=0,rounds=0;
function step(){const s=steps[i];left=s[1];orb.style.transitionDuration=s[1]+'s';orb.style.transform='scale('+s[2]+')';draw()}
function draw(){lbl.innerHTML=steps[i][0]+'<small>'+left+'</small>'}
function tick(){left--;if(left<=0){i=(i+1)%3;if(i===0){rounds++;sub.textContent=rounds+' round'+(rounds>1?'s':'')+' done · you\'re doing great ♡'}step()}else draw()}
go.onclick=()=>{if(run){clearInterval(run);run=null;go.textContent='start';orb.style.transitionDuration='1s';orb.style.transform='scale(.55)';lbl.innerHTML='paused<small>♡</small>';return}
 i=0;step();run=setInterval(tick,1000);go.textContent='stop'};
</script></body></html>
